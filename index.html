<!DOCTYPE html>
<html lang="en">

<!-- TODO read > checked -->

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Homepage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      color: white;
      box-sizing: border-box;
    }

    button,
    input,
    select {
      background-color: black;
    }

    body {
      padding-top: 20px;
      padding-bottom: 20px;
      background-color: #212830;
    }

    .app {
      margin-right: 20px;
      margin-left: 20px;
    }

    .article-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-top: 10px;
    }

    input[type="checkbox"] {
      margin-top: 2px;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    h2 {
      margin-top: 20px;
    }

    .form-accordion {
      margin-top: 20px;
      background-color: #2c2f3a;
      padding: 10px;
      border-radius: 5px;
    }

    form {
      margin-top: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-top: 1rem;
      gap: 0.5rem;
    }

    .form-input {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      max-width: 600px;
    }

    .form-controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 1rem;
    }

    .app-controls {
      display: flex;
      gap: 0.5em;
      justify-content: space-between;
      margin-top: 1rem;
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div
    hidden
    id="landing-page"
    class="form-accordion"
  >
    <h3>Sign In</h3>
    <form id="sign-in-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input
          class="form-input"
          type="email"
          id="login-email"
          placeholder="Email"
          required
        />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input
          class="form-input"
          type="password"
          id="login-password"
          placeholder="Password"
          required
        />
      </div>
      <div class="form-controls">
        <button
          id="sign-in-button"
          type="submit"
        >Sign In</button>
      </div>
    </form>
  </div>

  <div
    id="app"
    class="app"
    hidden
  >
    <details class="form-accordion">
      <summary>Add Link</summary>
      <form id="add-link-form">
        <div class="form-group">
          <label for="link-url">URL</label>
          <input
            class="form-input"
            id="link-url"
            name="url"
            placeholder="URL"
            required
          >
        </div>
        <div class="form-group">
          <label for="link-category">Category</label>
          <select
            class="form-input"
            id="link-category"
            name="categorySelect"
          >
            <option value="">Select a category</option>
            <!-- Options will be populated by JS -->
          </select>
        </div>
        <div class="form-group">
          <label for="link-category-text">Category</label>
          <input
            class="form-input"
            type="text"
            id="link-category-text"
            name="categoryText"
            placeholder="Category"
          >
        </div>
        <div class="form-group">
          <label for="link-read">
            <input
              type="checkbox"
              id="link-read"
              name="read"
            >
            Is Read
          </label>
        </div>
        <div class="form-controls">
          <button type="submit">Add</button>
        </div>
      </form>
    </details>

    <div id="links"></div>

    <div class="app-controls">
      <button id="toggle-checked-button">Toggle Checked</button>
      <button id="reset-password-button">reset password</button>
    </div>
  </div>
</body>

<script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import {
    query,
    getFirestore,

    setDoc,
    getDocsFromServer,
    collection,
    where,
    doc, updateDoc, arrayUnion
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
  // https://firebase.google.com/docs/web/setup#available-libraries
  // Your web app's Firebase configuration

  // Initialize Firebase

  const app = document.getElementById('app');
  const landingPage = document.getElementById('landing-page');
  const links = document.getElementById('links');
  const signInButton = document.getElementById('sign-in-button');
  const addLinkForm = document.getElementById('add-link-form');
  const categoryText = document.getElementById('link-category-text');
  const categorySelect = document.getElementById('link-category');
  const toggleCheckedButton = document.getElementById('toggle-checked-button');

  const state = {};
  const firebaseApp = await initializeApp(firebaseConfig);
  const auth = await getAuth(firebaseApp);
  const db = await getFirestore(firebaseApp);

  await auth.authStateReady();
  await init();

  toggleCheckedButton.addEventListener('click', () => {
    state.showChecked = !state.showChecked;
    toggleCheckedButton.textContent = state.showChecked ? 'Hide Checked' : 'Show Checked';
    render(state.links);
  });

  categoryText.addEventListener('input', () => {
    if (categoryText.value) {
      categorySelect.value = '';
    }
  });

  categorySelect.addEventListener('change', () => {
    if (categorySelect.value) {
      categoryText.value = '';
    }
  });

  signInButton.addEventListener('click', async (event) => {
    event.preventDefault();
    await signIn();
  });

  addLinkForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    await linkSubmit(event);
  });

  document.getElementById('reset-password-button').addEventListener('click', async () => {
    try {
      await sendPasswordReset();
      alert('Password reset email sent');
    } catch (error) {
      alert('Error sending password reset email: ' + error.message);
    }
  });

  async function linkSubmit(event) {
    const form = event.target;
    const url = form.url.value;
    const category = form.categoryText.value || form.categorySelect.value;
    const read = form.read.checked;

    if (!url || !category) {
      alert('Please fill in all fields');
      return;
    }

    const link = createLink(url, category, read);
    await updateDocument(link);
    await fetchLinksAndAddToState();
    render(state.links);
    form.reset();
  }

  function createLink(url, category, read) {
    return {
      url,
      category,
      read: !!read,
    };
  }

  async function init() {
    if (isUserLoggedIn(auth)) {
      showEl(app);
      hideEl(landingPage);
      await fetchLinksAndAddToState()

      render(state.links);
    } else {
      showEl(landingPage);
      hideEl(app);
    }
  }

  async function fetchLinksAndAddToState() {
    try {
      const doc = await fetchDocument()
      state.document = doc;
      state.links = state.document.data().links;
      state.categories = linkCategories(state.links);
      state.showChecked = state.showChecked ?? false

    } catch (error) {
      state.document = null;
      state.links = [];
      state.categories = [];
      state.showChecked = false

      alert('Error fetching links')
    }

  }

  async function updateDocument(link) {
    const docRef = doc(db, "links", state.document.id);

    await updateDoc(docRef, {
      links: arrayUnion(link)
    });
  }

  async function fetchDocument() {
    const q = query(collection(db, "links"), where("userId", "==", auth.currentUser.uid))
    const querySnapshot = await getDocsFromServer(q);
    const [doc] = querySnapshot.docs;
    if (!doc) {
      throw new Error('No documents found in the "links" collection');
    }

    console.log(doc.data().userId);
    console.log(auth.currentUser.uid);

    return doc
  }

  async function signIn() {
    const email = document.getElementById("login-email").value || "mcompendium2600@gmail.com";
    const password = document.getElementById("login-password").value;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      await fetchLinksAndAddToState()
      init(); //TODO not ideal to call init here

    } catch (error) {
      alert("Sign-in error: " + error.message);
    }
  }


  function insertList(list, title) {
    const heading = document.createElement('h2');
    heading.textContent = title;
    links.appendChild(heading);
    const ul = document.createElement('ul');

    list.filter(({ url }) => !!url)
      .sort((a, b) => a.checked - b.checked)
      .filter(({ checked }) => state.showChecked || !checked)
      .forEach(({ url, checked }) => {
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
        link.textContent = url;

        const checkbox = document.createElement('input');
        checkbox.setAttribute('type', 'checkbox');
        checkbox.setAttribute('value', url);
        checkbox.setAttribute('class', 'link-checkbox');
        addCheckboxChangeListener(checkbox);

        if (!!checked) {
          checkbox.setAttribute('checked', true);
        }

        const wrapper = document.createElement('li');
        wrapper.setAttribute('class', 'article-wrapper');

        wrapper.appendChild(checkbox);
        wrapper.appendChild(link);
        ul.appendChild(wrapper);
      })

    links.appendChild(ul);
  }

  async function addCheckboxChangeListener(el) {
    el.addEventListener('change', async (event) => {
      const isChecked = event.target.checked;
      const linkUrl = event.target.value;
      const docRef = doc(db, "links", state.document.id);

      const updatedLinks = state.links.map((link) => {
        if (link.url !== linkUrl) return link

        return { ...link, read: isChecked }

      })

      await updateDoc(docRef, {
        links: updatedLinks
      });

      await fetchLinksAndAddToState();
      render(state.links);
    });
  }


  function groupLinksByCategory(links) {
    return links.reduce((map, { url, read, category }) => {
      if (!category) return map;
      if (!map[category]) {
        map[category] = [];
      }
      map[category].push({ url, checked: read });
      return map;
    }, {});
  }

  function render(links) {
    clearDom();
    const groupedLinks = groupLinksByCategory(links);
    Object.entries(groupedLinks).forEach(([category, links]) => {
      insertList(links, category);
    });

    populateCategorySelect();
  }

  function clearDom() {
    document.querySelectorAll('.link-checkbox').forEach(el => el.removeEventListener('change', () => { }));
    links.innerHTML = '';
  }

  function isUserLoggedIn(auth) {
    return auth.currentUser !== null;
  }

  function hideEl(el) {
    el.setAttribute('hidden', true);
  }

  function showEl(el) {
    el.removeAttribute('hidden');
  }

  function linkCategories(links) {
    return Array.from(new Set(links.map(link => link.category).filter(Boolean)));
  }

  function populateCategorySelect() {
    const select = document.getElementById('link-category');
    if (!select || !state.categories) return;
    // Remove old options except the first
    while (select.options.length > 1) {
      select.remove(1);
    }
    state.categories.forEach(category => {
      const option = document.createElement('option');
      option.value = category;
      option.textContent = category;
      select.appendChild(option);
    });
  }

  async function sendPasswordReset() {
    //  const actionCodeSettings = {
    //   url: 'https://www.example.com/?email=user@example.com',
    //   iOS: {
    //      bundleId: 'com.example.ios'
    //   },
    //   android: {
    //     packageName: 'com.example.android',
    //     installApp: true,
    //     minimumVersion: '12'
    //   },
    //   handleCodeInApp: true
    // };
    await sendPasswordResetEmail(auth, auth.currentUser.email);
    // Obtain code from user.
    // await confirmPasswordReset('user@example.com', code);
  }
</script>
